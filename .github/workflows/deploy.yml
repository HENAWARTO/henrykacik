name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Run JavaScript actions with the runtime that GitHub-hosted runners use after
# the Node 20 deprecation. This also makes runtime regressions visible now.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

      # Build the Pages artifact explicitly so upload-artifact runs on Node 24.
      # upload-pages-artifact@v4 currently delegates to upload-artifact@v4,
      # which produces GitHub's Node 20 deprecation annotation.
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --directory dist -cvf "$RUNNER_TEMP/github-pages.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
